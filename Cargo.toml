[workspace]
resolver = "2"
members = [
    ".",
    "crates/bot_core",
    "crates/rendering",
    "crates/telegram_ui",
    "crates/stats",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[package]
name = "monospace-bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "monospace-bot"
path = "src/main.rs"

[dependencies]
bot_core = { path = "crates/bot_core" }
rendering = { path = "crates/rendering" }
telegram_ui = { path = "crates/telegram_ui" }
stats = { path = "crates/stats" }
teloxide = { version = "0.17", features = ["webhooks-axum"] }
dptree = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
pretty_env_logger = "0.5"
