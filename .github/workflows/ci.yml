name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies (rusqlite bundled needs a C toolchain)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace --release

      - name: Verify deploy_config.rs placeholder is still a placeholder in CI
        run: |
          if ! grep -q 'REPLACE_WITH_YOUR_BOT_TOKEN_FROM_BOTFATHER' deploy_config.rs; then
            echo "::notice::deploy_config.rs has been edited with a real token — make sure this repo is private before pushing a real BOT_TOKEN to source control."
          fi

  docker-build:
    name: Docker build (deploy image)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — validates the Dockerfile builds cleanly)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: monospace-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
